<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>linux-whazzapp</title>
<style>
  /* Aurora title bar: drag strip above WhatsApp; the window buttons on the right are Electron's overlay.
     Only the 34 px bar may be a drag region: drag regions apply to the whole window, also under the
     WhatsApp view, so a drag area any taller would swallow every click in WhatsApp. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Same look as the series' shared aurora.py: the whole window gets the Aurora background (the bar shows
     its top slice, so the cyan glow from the top-left shines through) and the bar itself is almost clear. */
  body { background: linear-gradient(135deg, #f6f2ff, #eef8ff 55%, #fff4f8); color: #1f1a3a;
         user-select: none; cursor: default; font: 600 13px Ubuntu, "Noto Sans", sans-serif; }
  .bar { -webkit-app-region: drag; height: 34px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
         background: rgba(255,255,255,0.58); box-shadow: inset 0 -1px rgba(124,92,255,0.12); }
  @media (prefers-color-scheme: dark) {
    body { color: #ecebff; background:
      radial-gradient(ellipse at 12% -5%, rgba(34,211,238,0.20), transparent 55%),
      radial-gradient(ellipse at 100% 105%, rgba(168,85,247,0.24), transparent 55%), #0c0e1a; }
    .bar { background: rgba(255,255,255,0.04); box-shadow: inset 0 -1px rgba(255,255,255,0.07); }
  }
</style></head>
<body><div class="bar">Linux WhazzApp</div>
<script>
  // System frame: no bar (and so no drag region) at all
  if (new URLSearchParams(location.search).has('framed')) document.querySelector('.bar').remove();
  // Report the real size of the window's content to the main process (it lays out the WhatsApp view)
  const report = () => { document.title = 'size:' + innerWidth + 'x' + innerHeight; };
  addEventListener('resize', report);
  report();
</script></body></html>
